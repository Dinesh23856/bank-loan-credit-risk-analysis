services:
  mysql:
    image: mysql:8.4
    container_name: bank-loan-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: change-me-root
      MYSQL_DATABASE: bank_loan_db
      MYSQL_USER: loanapp
      MYSQL_PASSWORD: change-me
    ports:
      - "3306:3306"
    volumes:
      - bank_loan_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -pchange-me-root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  bank_loan_mysql_data:
